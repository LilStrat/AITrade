# =============================================================================
#  INSTRUMENT UNIVERSE
#  The bot evaluates every ENABLED instrument below, every trading day.
#  It only proposes a trade when a strategy's rules AND every risk check pass.
#
#  Symbols use Yahoo Finance format (".L" = London Stock Exchange).
#  type     : stock | etf          (only these two are allowed in v1)
#  sector   : used for concentration limits
#  tier     : large_cap | mid_cap | etf  (used for spread cost estimates)
#  currency : auto (detected from the data source) or GBP / GBX / USD
#  leveraged: must be false - leveraged/inverse products are refused
#
#  IMPORTANT (survivorship bias): this is a list of companies that are large
#  TODAY. Backtesting only today's survivors flatters historical results,
#  because companies that shrank or were delisted are missing. Treat backtest
#  results on this list as optimistic.
# =============================================================================

