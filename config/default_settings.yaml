# =============================================================================
#  DEFAULT SETTINGS - do not edit this file.
#  Your own changes go in config/settings.yaml (created automatically on first
#  run, and edited by the dashboard's Settings page). Anything you put there
#  overrides the value here.
# =============================================================================

app:
  # Operating mode. One of: local_paper, broker_paper, live
  #  - local_paper : simulated account on this PC (DEFAULT, no real money)
  #  - broker_paper: a broker's own paper account (NOT AVAILABLE in v1)
  #  - live        : real money (DISABLED - requires a separate readiness
  #                  process; see docs/LIVE_TRADING.md)
  # Backtesting is always available and never touches any account.
  mode: local_paper
  base_currency: GBP
  timezone: Europe/London
  # The dashboard only ever listens on this computer (127.0.0.1).
  dashboard_port: 8765
  # When true, the bot runs its once-a-day paper trading cycle by itself while
  # the app is open (after the UK market close). OFF by default: you press
  # "Run daily cycle" yourself until you are happy with how it behaves.
  auto_daily_cycle: false
  # London time after which the daily cycle may run (LSE closes 16:30, the
  # closing auction finishes ~16:35, free data sources update later).
  daily_cycle_time: "18:00"

account:
  # gia = General Investment Account (gains may be subject to CGT)
  # isa = Stocks & Shares ISA (gains/dividends free of UK tax; ISA rules apply)
  type: gia

data:
  # Where prices come from. One of: yahoo, stooq, eodhd, synthetic
  #  yahoo     : free, unofficial (via the yfinance library). Personal use
  #              only. Daily LSE bars. No SLA - may break without notice.
  #  stooq     : free CSV downloads, fallback. Personal use.
  #  eodhd     : paid (from ~$19.99/month) or free 20 calls/day. Needs an
  #              API key in your .env file (EODHD_API_TOKEN).
  #  synthetic : made-up prices for demonstrations and tests ONLY.
  provider: yahoo
  fallback_provider: stooq
  # Years of daily history to download on first use.
  history_years: 12
  # A symbol's data is "stale" if its latest bar is older than this many
  # completed trading sessions. Stale data blocks new orders for that symbol.
  stale_after_sessions: 1
  # A one-day move larger than this (percent) is flagged as suspicious and
  # blocks trading in that symbol until reviewed.
  suspicious_move_pct: 35
  # How long to wait between requests to the data provider (seconds).
  request_delay_seconds: 1.0
  max_retries: 3

universe:
  file: config/universe.yaml
  # Broad UK market proxy used for the market regime filter and as the
  # buy-and-hold benchmark. ISF.L = iShares Core FTSE 100 UCITS ETF.
  benchmark: ISF.L
  # Annual interest assumed for the "cash" benchmark (percent).
  cash_benchmark_rate_pct: 4.0
  # Ignore instruments whose average daily traded value is below this (GBP).
  min_avg_daily_value_gbp: 500000
  min_price_gbp: 0.20

paper:
  starting_capital: 10000
  # Cost profile used to estimate charges (see "costs" below).
  cost_profile: ibkr_uk_fixed

risk:
  # These are conservative EXAMPLES, not advice. See docs/RISK.md.
  max_risk_per_trade_pct: 0.5      # equity lost if the stop is hit (before gaps)
  max_daily_loss_pct: 1.0          # pause new entries for the day
  max_drawdown_pct: 5.0            # pause ALL new entries until you resume
  max_position_pct: 20.0           # max value of one position vs equity
  max_total_exposure_pct: 95.0     # max invested vs equity (no leverage)
  max_sector_pct: 40.0
  max_open_positions: 6
  max_correlated_positions: 2      # max holdings with correlation above threshold
  correlation_threshold: 0.80
  correlation_lookback_days: 60
  min_cash_reserve_pct: 3.0
  max_pct_of_avg_volume: 1.0       # order size vs 20-day average volume
  # Reject trades whose estimated round-trip costs exceed this share of the
  # amount being risked (stops tiny trades being eaten by fixed commissions).
  max_cost_pct_of_risk: 20.0
  min_stop_distance_pct: 1.0
  max_stop_distance_pct: 20.0
  # Pause after this many consecutive errors in the daily cycle.
  failure_pause_threshold: 3
  # Warn when a limit is this close to being reached (percent of the limit).
  warn_at_pct_of_limit: 75
  # LOCKED - these cannot be enabled in v1 (the code refuses them).
  allow_short: false
  allow_leverage: false

costs:
  # Estimated, not guaranteed. Verify against your broker's current tariff.
  spread_bps:            # assumed HALF of bid-ask spread, in basis points (1bp = 0.01%)
    large_cap: 5
    etf: 5
    mid_cap: 15
    default: 20
  slippage_bps: 5        # extra adverse price movement on market orders
  stop_slippage_bps: 15  # extra slippage when a stop is triggered
  # UK Stamp Duty Reserve Tax on purchases of UK shares (not ETFs).
  stamp_duty_pct: 0.5
  # Panel on Takeovers and Mergers levy on UK share trades above £10,000.
  ptm_levy_gbp: 1.50
  ptm_levy_threshold_gbp: 10000
  # Dividend withholding assumed for US-listed instruments (W-8BEN filed).
  us_dividend_withholding_pct: 15
  profiles:
    ibkr_uk_fixed:
      label: "Interactive Brokers UK - Fixed pricing (LSE)"
      gbp_commission_pct: 0.05
      gbp_commission_min: 3.00
      usd_per_share: 0.005
      usd_commission_min: 1.00
      usd_commission_max_pct: 1.0
      fx_fee_pct: 0.03
    trading212:
      label: "Trading 212 Invest/ISA (zero commission, FX fee)"
      gbp_commission_pct: 0.0
      gbp_commission_min: 0.0
      usd_per_share: 0.0
      usd_commission_min: 0.0
      usd_commission_max_pct: 0.0
      fx_fee_pct: 0.15
    zero_cost:
      label: "Zero costs (for comparison only - unrealistic)"
      gbp_commission_pct: 0.0
      gbp_commission_min: 0.0
      usd_per_share: 0.0
      usd_commission_min: 0.0
      usd_commission_max_pct: 0.0
      fx_fee_pct: 0.0

execution:
  # Daily strategies decide after the close and act at the NEXT session's
  # opening price. Orders larger than this share of that day's volume are
  # only partly filled.
  max_pct_of_bar_volume: 5.0
  # Cash reserved for a buy order = estimated cost x (1 + this buffer).
  reserve_buffer_pct: 3.0

strategies:
  trend_pullback:
    enabled: true
  breakout_momentum:
    enabled: true

ai:
  enabled: true
  ollama_url: "http://127.0.0.1:11434"
  model: "llama3.1:8b"
  # Unload the model from GPU memory after this idle time.
  keep_alive: "5m"
  context_tokens: 4096
  temperature: 0.2
  timeout_seconds: 120

notifications:
  # Dashboard alerts and log files are always on. Optional email (SMTP) is
  # configured through the .env file; see docs/SETUP.md.
  email_enabled: false
  email_min_level: warning
